name = "fitnessdonner-gutscheine"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Zwei Zeitpläne:
#   10 7 * * *    täglicher Morgenlauf (07:10 UTC), holt Liegengebliebenes nach
#   */15 * * * *  Viertelstunden-Takt: verschickt Gutscheine zur gewählten Uhrzeit (ab worker-code-25)
[triggers]
crons = ["10 7 * * *", "*/15 * * * *"]

# KV-Namespace für die Gutscheine.
# id nach dem Anlegen im Cloudflare-Dashboard hier eintragen:
#   Workers & Pages -> KV -> Create namespace -> Name: VOUCHERS
[[kv_namespaces]]
binding = "VOUCHERS"
id = "bfa2286cf9984972ac533c02c1d57111"

# Klartext-Variablen (keine Geheimnisse)
[vars]
SITE_ORIGIN = "https://fitnessdonner.de"
OWNER_EMAIL = "info@fitnessdonner.de"
FROM_EMAIL = "Fitness Donner <gutschein@fitnessdonner.de>"

# Secrets werden NICHT hier eingetragen, sondern einzeln gesetzt:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put RESEND_API_KEY
# (oder im Dashboard unter Settings -> Variables and Secrets)
